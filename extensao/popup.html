<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 14px; background: #262624; color: #ece9e1; font: 13px "Segoe UI", sans-serif; }
  h1 { font-size: 14px; margin: 0 0 8px; color: #d97757; }
  .site { font-family: Consolas, monospace; font-size: 12px; color: #9b978d; word-break: break-all; margin-bottom: 10px; }
  p { margin: 6px 0; line-height: 1.4; color: #c9c5bb; }
  button { width: 100%; margin-top: 8px; padding: 8px; border: 0; border-radius: 8px; background: #3a3936; color: #ece9e1;
           font: 600 13px "Segoe UI", sans-serif; cursor: pointer; }
  button:hover { background: #4a4844; }
  button.forte { background: #d97757; color: #1f1e1d; }
  button.forte:hover { background: #e58a6c; }
  button.fraco { background: none; color: #9b978d; font-weight: 400; }
  input { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 7px 9px; border-radius: 8px; border: 1px solid #55534e;
          background: #1f1e1d; color: #ece9e1; font: 13px "Segoe UI", sans-serif; }
  ol { margin: 6px 0 0 18px; padding: 0; color: #c9c5bb; font-size: 12px; max-height: 140px; overflow: auto; }
  .gravando { color: #e74c3c; font-weight: 600; }
  .erro { color: #e8452c; }
</style>
</head>
<body>
  <h1>🤖 Rotinas do Claudinho</h1>
  <div class="site" id="site"></div>
  <div id="conteudo"></div>
  <script src="popup.js"></script>
</body>
</html>
